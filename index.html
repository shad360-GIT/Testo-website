    <script>
      (function () {
        try {
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (obj, prop, descriptor) {
            if (
              (obj === window || obj === Window.prototype || obj === globalThis) &&
              prop === 'fetch' &&
              descriptor &&
              descriptor.get &&
              !descriptor.set
            ) {
              var getter = descriptor.get;
              var customVal;
              var hasCustom = false;
              descriptor = Object.assign({}, descriptor, {
                configurable: true,
                get: function () {
                  return hasCustom ? customVal : getter.call(this);
                },
                set: function (v) {
                  hasCustom = true;
                  customVal = v;
                }
              });
            }
            return origDefineProperty.call(Object, obj, prop, descriptor);
          };

          var currentFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          origDefineProperty.call(Object, window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return currentFetch;
            },
            set: function (v) {
              currentFetch = v;
            }
          });
        } catch (e) {}
      })();
    </script>
