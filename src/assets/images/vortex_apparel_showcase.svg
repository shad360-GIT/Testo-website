         L 14 -82
         L 17 -82
         L 17 -74
         L 14 -74
         L 14 -64
         C 14 -54, 22 -48, 22 -34
         L 22 76
         C 22 83, 17 86, 10 86
         L -10 86
         C -17 86, -22 83, -22 76
         L -22 -34
         C -22 -48, -14 -54, -14 -64
         L -14 -74
         L -17 -74
         L -17 -82
         L -14 -82
