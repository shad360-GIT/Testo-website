<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 647" width="100%" height="100%">
  <defs>
    <style>
      .category-label {
        font-family: 'Oswald', 'Impact', 'Haettenschweiler', 'Arial Narrow', 'Space Grotesk', 'Inter', sans-serif;
        font-weight: 700;
        font-stretch: condensed;
        font-size: 36px;
        fill: #000000;
        text-anchor: middle;
        letter-spacing: 1.2px;
      }
    </style>
  </defs>

  <!-- Warm Off-White Background -->
  <rect x="0" y="0" width="1150" height="647" fill="#f0efec" />

  <!-- Top Dark Teal Line -->
  <rect x="0" y="0" width="1150" height="8" fill="#084c41" />

  <!-- 1. MEN'S T-Shirt Silhouette -->
  <g transform="translate(125, 255)">
    <path
      d="M -22 -118
         C -14 -112, 14 -112, 22 -118
         L 52 -102
         C 60 -97, 64 -88, 66 -62
         L 67 -35
         L 42 -35
         L 42 86
         L -42 86
         L -42 -35
         L -67 -35
         L -66 -62
         C -64 -88, -60 -97, -52 -102
         Z"
      fill="#000000"
    />
    <text x="0" y="160" class="category-label">MEN'S</text>
  </g>

  <!-- 2. WOMEN'S T-Shirt Silhouette -->
  <g transform="translate(345, 255)">
    <path
      d="M -24 -118
         C -14 -114, 14 -114, 24 -118
         L 48 -108
         C 54 -105, 58 -96, 63 -60
         L 38 -52
         C 34 -18, 28 8, 36 48
         L 40 68
         C 22 92, -22 92, -40 68
         L -36 48
         C -28 8, -34 -18, -38 -52
         L -63 -60
         C -58 -96, -54 -105, -48 -108
         Z"
      fill="#000000"
