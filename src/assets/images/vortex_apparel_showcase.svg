         L 94 -22
         L 89 -18
         C 84 6, 70 25, 46 26
         C 24 27, 14 12, 8 -14
         C 4 -22, -4 -22, -8 -14
         C -14 12, -24 27, -46 26
         C -70 25, -84 6, -89 -18
         L -94 -22
         L -94 -30
         C -94 -37, -92 -41, -88 -42
